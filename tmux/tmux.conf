set-option -g default-shell /bin/zsh
set -ga terminal-features '*:RGB'
set -g default-terminal "tmux-256color"
set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set-option -g status-position top

# action key
unbind C-b
set-option -g prefix C-a
set-option -g repeat-time 0
set-option -g focus-events on
setw -g mode-keys vi

set-option -g history-limit 5000

# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# vim-like pane switching
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R 

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "/mnt/c/Windows/System32/clip.exe"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "/mnt/c/Windows/System32/clip.exe"

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window
bind-key -r f run-shell "tmux neww ~/.config/bin/tmux-sessionizer.sh"
bind-key @ command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key $ command-prompt -p "send pane to:"  "break-pane -t '%%'"

# Resizing pane
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

source ~/.config/tmux/utility.conf

set -g @plugin 'catppuccin/tmux#v2.1.2' # See https://github.com/catppuccin/tmux/tags for additional tags
set -g @plugin 'tmux-plugins/tpm'

set -g @catppuccin_flavor "mocha"

set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W "

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W "

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

set -g status-left ""
set -g  status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_session}"

set -g @catppuccin_window_current_background "#{@thm_peach}"
set -g @catppuccin_status_background "default"


set-environment -g PATH "/usr/local/bin:/bin:/usr/bin"
run '~/.tmux/plugins/tpm/tpm'

# tmux-agent-inbox (local checkout; not on TPM yet).
# Loaded after tpm so its status-right segment isn't overwritten.
# Key is A, not the plugin default I — tpm already owns prefix + I.
set -g @agent-inbox-key A
run-shell '~/source/repos/tmux-agent-inbox/agent-inbox.tmux'
