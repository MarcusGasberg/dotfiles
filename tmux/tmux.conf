set -g default-terminal xterm-256color
set-option -g default-shell /bin/zsh
set -ag terminal-overrides ",alacritty:RGB,xterm-256color:RGB"
set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1

# action key
unbind C-b
set-option -g prefix C-a
set-option -g repeat-time 0
set-option -g focus-events on
setw -g mode-keys vi

# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# vim-like pane switching
bind -r k select-pane -U 
bind -r j select-pane -D 
bind -r h select-pane -L 
bind -r l select-pane -R 

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window
bind-key -r f run-shell "tmux neww ~/.config/bin/tmux-sessionizer.sh"

# AI / Claude workflow
bind a split-window -h -c "#{pane_current_path}" claude
bind C-w run-shell "~/.config/bin/tmux-workspace.sh #{pane_current_path}"
bind A run-shell "tmux list-windows -t '#{session_name}' -F '##I ##W' | awk '/^[0-9]+ agent:/{print \$1; exit}' | xargs -I{} tmux select-window -t '#{session_name}:{}'"

bind-key @ command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key $ command-prompt -p "send pane to:"  "break-pane -t '%%'"

# Resizing pane (arrows resize; hjkl stays navigation-only)
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

source ~/.config/tmux/utility.conf

set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# --- catppuccin v2 options: must be set BEFORE the theme is loaded ---
set -g @catppuccin_flavor 'mocha'

# window styling: "rounded" draws the same  /  powerline separators the
# old v1 config set by hand, without v2 custom mode's stray block glyph
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text " #{pane_current_path}"
set -g @catppuccin_date_time_text " %H:%M %d-%m-%Y"

# --- load the theme, THEN compose the status line from its modules ---
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_user}"
set -ag status-right "#{E:@catppuccin_status_host}"
set -ag status-right "#{E:@catppuccin_status_session}"

run '~/.config/tmux/plugins/tpm/tpm'

# agent inbox (local dev checkout) — must load after anything that rewrites status-right
# agent inbox - prefer the local dev checkout, fall back to the TPM-installed
# copy, and no-op cleanly if neither exists (fresh clone / another machine).
if-shell '[ -x "$HOME/source/repos/tmux-agent-inbox/agent-inbox.tmux" ]' \
  'run-shell "$HOME/source/repos/tmux-agent-inbox/agent-inbox.tmux"'
