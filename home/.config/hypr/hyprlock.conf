$mauve = rgb(cba6f7)
$red = rgb(f38ba8)
$maroon = rgb(eba0ac)
$peach = rgb(fab387)
$yellow = rgb(f9e2af)
$green = rgb(a6e3a1)
$teal = rgb(94e2d5)
$sky = rgb(89dceb)
$sapphire = rgb(74c7ec)
$blue = rgb(89b4fa)
$lavender = rgb(b4befe)
$text = rgb(cdd6f4)
$subtext1 = rgb(bac2de)
$subtext0 = rgb(a6adc8)
$overlay2 = rgb(9399b2)
$overlay1 = rgb(7f849c)
$overlay0 = rgb(6c7086)
$surface2 = rgb(585b70)
$surface1 = rgb(45475a)
$surface0 = rgb(313244)
$base = rgb(1e1e2e)
$mantle = rgb(181825)
$crust = rgb(11111b)

# Generated M3 palette. Overrides the Catppuccin values above (later wins in
# hyprlang). If absent, the values above still give a usable lock screen.
source = /home/marcusg/.local/state/theme/hyprlock-colors.conf

general {
    # hyprlock 0.9.5 accepts only: fail_timeout, fractional_scaling,
    # hide_cursor, ignore_empty_input, immediate_render, screencopy_mode,
    # text_trim. no_fade_in / no_fade_out / grace / disable_loading_bar were
    # silently ignored here ("config option does not exist") - they are CLI
    # flags now (--no-fade-in, --grace N), so they moved to the keybind.
    hide_cursor = false
    immediate_render = true
    ignore_empty_input = true
}

background {
    path = ~/.local/state/theme/wallpaper
    blur_passes = 2
    blur_size = 4
    brightness = 0.5
    contrast = 1
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

input-field {
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = $text
    fade_on_empty = false
    rounding = -1
    check_color = $peach
    placeholder_text = Input Password...
    hide_input = false
    position = 0, -200
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(242, 243, 244, 0.75)
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +"%-I:%M")"
    color = rgba(242, 243, 244, 0.75)
    font_size = 95
    font_family = JetBrains Mono
    position = 0, 200
    halign = center
    valign = center
}

label {
    text = marcusg
    color = rgba(242, 243, 244, 0.75)
    font_size = 14
    font_family = JetBrains Mono
    position = 0, -10
    halign = center
    valign = top
}

label {
    text = cmd[update:30] ~/.config/hypr/scripts/battery.sh
    color = rgba(242, 243, 244, 0.75)
    font_size = 24
    font_family = JetBrains Mono
    position = -90, -10
    halign = right
    valign = top
}

label {
    text = cmd[update:1000] ~/.config/hypr/scripts/whatsong.sh
    color = rgba(242, 243, 244, 0.75)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 50
    halign = center
    valign = bottom
}
