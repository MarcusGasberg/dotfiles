
[terminal.shell]
program = "/bin/zsh"
args = ["-l"]

[env]
TERM = "xterm-256color"

[window]
decorations = "None"
dynamic_padding = true
opacity = 0.9

[font]
size = 12.0

[font.bold]
family = "IosevkaTerm NFM"
style = "Bold"

[font.bold_italic]
family = "IosevkaTerm NFM"
style = "Bold Italic"

[font.italic]
family = "IosevkaTerm NFM"
style = "Italic"

[font.normal]
family = "IosevkaTerm NFM"
style = "Regular"

[general]
import = [
  # Fallback: a complete, always-present scheme. Kept so a fresh clone (or a
  # failed matugen run) still has sane colours.
  "~/.config/alacritty/catppuccin-mocha.toml",
  # Generated from the wallpaper by `retheme`. Imported second, so it wins.
  # A missing import is not an error in alacritty - verified.
  "~/.local/state/theme/alacritty.toml"
]

[terminal]

