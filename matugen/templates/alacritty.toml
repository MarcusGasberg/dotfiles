# GENERATED by matugen - do not edit. Source: templates/alacritty.toml
#
# Imported AFTER catppuccin-mocha.toml, so these win. If this file is missing
# (fresh clone, or retheme never run) alacritty silently falls back to
# catppuccin - verified: a missing import is not an error.
#
# ANSI 1-6 are PINNED to fixed hues and deliberately do NOT follow the
# wallpaper. matugen's own base16 output was measured on this machine as eight
# shades of dark navy with no red/green/blue at all; driving ANSI from a
# wallpaper also means `git diff` renders additions in whatever hue the image
# happens to be. Backgrounds, greys and foregrounds DO follow the wallpaper -
# they carry no meaning.

[colors.primary]
background = "{{colors.surface.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
dim_foreground = "{{colors.on_surface_variant.default.hex}}"
bright_foreground = "{{colors.on_surface.default.hex}}"

[colors.cursor]
text = "{{colors.on_primary.default.hex}}"
cursor = "{{colors.primary.default.hex}}"

[colors.vi_mode_cursor]
text = "{{colors.on_tertiary.default.hex}}"
cursor = "{{colors.tertiary.default.hex}}"

[colors.selection]
text = "{{colors.on_primary_container.default.hex}}"
background = "{{colors.primary_container.default.hex}}"

[colors.search.matches]
foreground = "{{colors.on_tertiary_container.default.hex}}"
background = "{{colors.tertiary_container.default.hex}}"

[colors.search.focused_match]
foreground = "{{colors.on_tertiary.default.hex}}"
background = "{{colors.tertiary.default.hex}}"

[colors.hints.start]
foreground = "{{colors.on_primary.default.hex}}"
background = "{{colors.primary.default.hex}}"

[colors.hints.end]
foreground = "{{colors.on_surface.default.hex}}"
background = "{{colors.surface_container_high.default.hex}}"

[colors.footer_bar]
foreground = "{{colors.on_surface.default.hex}}"
background = "{{colors.surface_container.default.hex}}"

# --- ANSI: 0/7 track the wallpaper (they are greys), 1-6 are pinned ---------
[colors.normal]
black   = "{{colors.surface_container_high.default.hex}}"
red     = "#e05561"
green   = "#8cc265"
yellow  = "#d9c26a"
blue    = "#5f9fd8"
magenta = "#c495d0"
cyan    = "#5fb3b3"
white   = "{{colors.on_surface_variant.default.hex}}"

[colors.bright]
black   = "{{colors.outline.default.hex}}"
red     = "#ef7a82"
green   = "#a5d182"
yellow  = "#e6d28a"
blue    = "#7fb5e4"
magenta = "#d6b0de"
cyan    = "#7fc6c6"
white   = "{{colors.on_surface.default.hex}}"

[colors.dim]
black   = "{{colors.surface_container.default.hex}}"
red     = "#b8434f"
green   = "#6f9e50"
yellow  = "#ab9a53"
blue    = "#4b7dab"
magenta = "#9c76a5"
cyan    = "#4b8c8c"
white   = "{{colors.outline.default.hex}}"
